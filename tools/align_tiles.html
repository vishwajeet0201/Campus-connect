<!doctype html>
<meta charset="utf-8">
<title>Campus tile aligner</title>
<style>
  body { margin: 0; font: 14px system-ui; background: #202124; color: #eee; }
  header { padding: 12px; position: sticky; top: 0; background: #202124; z-index: 2; }
  canvas { max-width: 100%; border: 1px solid #555; image-rendering: auto; }
  label, button { margin-right: 8px; }
</style>
<header>
  <label>Tiles <input id="files" type="file" multiple accept="image/*"></label>
  <label>layout.json <input id="layout" type="file" accept=".json"></label>
  <button id="export">Export corrected layout.json</button>
  <span id="status">Select tiles and layout.</span>
</header>
<canvas id="canvas"></canvas>
<script>
const files = document.querySelector("#files"), layoutFile = document.querySelector("#layout");
const canvas = document.querySelector("#canvas"), ctx = canvas.getContext("2d");
let images = [], layout = null, selected = 0, dragging = false, last = null;
function draw() {
  if (!layout || !images.length) return;
  const minX = Math.min(...layout.layout.map(x => x.x)), minY = Math.min(...layout.layout.map(x => x.y));
  const maxX = Math.max(...layout.layout.map(x => x.x + x.width)), maxY = Math.max(...layout.layout.map(x => x.y + x.height));
  canvas.width = maxX - minX; canvas.height = maxY - minY; ctx.clearRect(0, 0, canvas.width, canvas.height);
  layout.layout.forEach((item, i) => { ctx.globalAlpha = i === selected ? .65 : .35; ctx.drawImage(images.find(x => x.name === item.file), item.x - minX, item.y - minY); });
  ctx.globalAlpha = 1; document.querySelector("#status").textContent = `Selected ${layout.layout[selected].file}; arrows move 1px, Shift moves 10px.`;
}
files.onchange = async () => { images = await Promise.all([...files.files].map(file => new Promise(resolve => { const image = new Image(); image.onload = () => resolve(Object.assign(image, { name: file.name })); image.src = URL.createObjectURL(file); }))); draw(); };
layoutFile.onchange = async () => { layout = JSON.parse(await layoutFile.files[0].text()); draw(); };
window.onkeydown = event => { if (!layout || (event.key !== "ArrowLeft" && event.key !== "ArrowRight" && event.key !== "ArrowUp" && event.key !== "ArrowDown")) return; event.preventDefault(); const amount = event.shiftKey ? 10 : 1, item = layout.layout[selected]; item.x += event.key === "ArrowRight" ? amount : event.key === "ArrowLeft" ? -amount : 0; item.y += event.key === "ArrowDown" ? amount : event.key === "ArrowUp" ? -amount : 0; draw(); };
canvas.onpointerdown = event => { dragging = true; last = event; canvas.setPointerCapture(event.pointerId); };
canvas.onpointermove = event => { if (!dragging || !layout) return; const item = layout.layout[selected], scale = canvas.width / canvas.getBoundingClientRect().width; item.x += (event.clientX - last.clientX) * scale; item.y += (event.clientY - last.clientY) * scale; last = event; draw(); };
canvas.onpointerup = () => { dragging = false; };
canvas.onclick = event => { if (!layout) return; selected = (selected + 1) % layout.layout.length; draw(); };
document.querySelector("#export").onclick = () => { if (!layout) return; const blob = new Blob([JSON.stringify(layout, null, 2)], { type: "application/json" }); const link = document.createElement("a"); link.href = URL.createObjectURL(blob); link.download = "layout.json"; link.click(); };
</script>
