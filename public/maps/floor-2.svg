    <text class="label" x="510" y="300">202</text>
    <text class="label" x="760" y="300">203</text>
    <text class="label" x="1010" y="300">204</text>
    <text class="label" x="230" y="575">Innovation</text>
    <text class="label" x="485" y="575">Research</text>
    <text class="label" x="1005" y="575">Boardroom</text>
    <text class="label" x="1240" y="575">Archives</text>
    <text class="label" x="1180" y="802">Office</text>
