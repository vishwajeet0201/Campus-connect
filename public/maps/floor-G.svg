    <rect id="room-g202" class="room" x="430" y="460" width="220" height="180" rx="20" />
    <rect id="room-conference" class="room" x="930" y="460" width="220" height="180" rx="20" />
    <rect id="room-offices" class="room" x="1180" y="460" width="220" height="180" rx="20" />
    <rect id="room-cafeteria" class="room" x="1060" y="720" width="310" height="150" rx="20" />
    <rect id="room-lib" class="room" x="760" y="720" width="200" height="150" rx="20" />
    <rect id="room-entrance" class="room" x="170" y="720" width="240" height="150" rx="20" />
  </g>
  <g id="corridors">
