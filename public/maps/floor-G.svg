      .corridor { fill: #eef3fb; stroke: #c6d5ee; stroke-width: 2; }
      .label { font: 600 16px 'Segoe UI', sans-serif; fill: #1d2b45; }
      .small { font: 500 12px 'Segoe UI', sans-serif; fill: #53657e; }
    </style>
  </defs>
  <rect class="bg" width="1600" height="1000" />
  <g id="walls">
    <rect class="wall" x="80" y="90" width="1440" height="860" rx="24" />
  </g>
  <g id="rooms">
    <rect id="room-g101" class="room" x="180" y="180" width="220" height="180" rx="20" />
    <rect id="room-g102" class="room" x="430" y="180" width="220" height="180" rx="20" />
    <rect id="room-g103" class="room" x="680" y="180" width="220" height="180" rx="20" />
    <rect id="room-g104" class="room" x="930" y="180" width="220" height="180" rx="20" />
