    <text class="label" x="510" y="300">102</text>
    <text class="label" x="760" y="300">103</text>
    <text class="label" x="1010" y="300">104</text>
    <text class="label" x="250" y="575">Physics Lab</text>
    <text class="label" x="500" y="575">Chemistry</text>
    <text class="label" x="1015" y="575">Seminar</text>
    <text class="label" x="1225" y="575">Reading</text>
    <text class="label" x="1180" y="802">Office</text>
    <text class="label" x="250" y="802">Entrance</text>
    <text class="small" x="720" y="435">Academic corridor</text>
